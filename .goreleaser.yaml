# GoReleaser: builds and publishes the aiplex CLI and the aiplex-api server.
#
# Each release archive holds both binaries (aiplex and aiplex-api, plus
# LICENSE, README.md and CHANGELOG.md), because `aiplex dev` starts the API
# that sits next to the CLI. install.sh depends on the archive name and on the
# binaries being at the archive root; keep both in step with it.
#
# Usage:
#   goreleaser check                       # validate this file
#   goreleaser release --snapshot --clean --skip=publish   # local dry run (make release-dry)
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0  # real release, by CI
#
# The release workflow (.github/workflows/release.yml) runs on a v* tag, builds the
# Console first (it is embedded in the CLI), and uses the matching section of
# CHANGELOG.md as the release notes.

version: 2

project_name: aiplex

before:
  hooks:
    # The Console is embedded from console/built (go:embed), written by the Console build. Release binaries
    # must carry the built Console, not the placeholder page: build it first
    # (the release workflow runs `cd console && npm ci && npm run build`).
    - sh -c 'test -s console/built/index.html || { echo "the Console is not built (console/built/index.html is missing); run make console before goreleaser" >&2; exit 1; }'

builds:
  - id: aiplex
    main: ./cmd/aiplex-cli
    binary: aiplex
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
  # The API ships beside the CLI so `aiplex dev` (local mode) finds it.
  - id: aiplex-api
    main: ./cmd/aiplex-api
    binary: aiplex-api
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: default
    ids:
      - aiplex
      - aiplex-api
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "aiplex_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Used when no --release-notes file is given (for example `make release-dry`).
# The release workflow passes the CHANGELOG.md section instead.
changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge "
      - "^docs:"
      - "^chore:"
      - "^ci:"

release:
  github:
    owner: vamsiramakrishnan
    name: aiplex
  # A tag with a hyphen (v0.2.0-rc.1) is published as a pre-release.
  prerelease: auto
  header: |
    ## Installation

    ```bash
    # macOS / Linux
    curl -fsSL https://raw.githubusercontent.com/vamsiramakrishnan/aiplex/main/install.sh | bash

    # From source (Go 1.25+): builds bin/aiplex and bin/aiplex-api
    git clone https://github.com/vamsiramakrishnan/aiplex.git && cd aiplex && make build

    # Then, locally with no cloud account:
    aiplex dev
    ```

    Each archive contains `aiplex` and `aiplex-api`. Verify downloads against `checksums.txt`.
