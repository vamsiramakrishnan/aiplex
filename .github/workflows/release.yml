name: Release

# Runs when a version tag is pushed (git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0).
# The release notes are the matching section of CHANGELOG.md, so the changelog
# must be updated (the "Unreleased" heading renamed to the version) before tagging.
#
# Permissions notes:
# - packages: write is REQUIRED to push the release container images to ghcr.io.
# - id-token: write is REQUIRED for keyless cosign signing of checksums.txt
#   and of the container images (no cosign secret is used).
# - HOMEBREW_TAP_TOKEN is OPTIONAL: when the secret is empty/absent the Homebrew
#   tap upload is skipped (see skip_upload in .goreleaser.yaml) and the release
#   still succeeds. GITHUB_TOKEN is the only other credential used.

on:
  push:
    tags: ["v*"]

# All permissions are granted on the release job only.
permissions: {}

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Build console (embedded in CLI)
        run: cd console && npm ci && npm run build

      - name: Run tests before release
        run: go test ./... -count=1

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            /^## \[/ { found = 0 }
            /^\[[^]]+\]: / { found = 0 }
            found
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "CHANGELOG.md has no section '## [$version]'. Rename 'Unreleased' and commit before tagging." >&2
            exit 1
          fi

      # syft for the SBOMs over the release archives.
      - uses: anchore/sbom-action/download-syft@v0.17.9

      # cosign for keyless signing with the GitHub OIDC token (id-token: write).
      - uses: sigstore/cosign-installer@v3.7.0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          COSIGN_YES: "true"
