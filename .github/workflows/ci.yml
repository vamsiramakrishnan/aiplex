name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Go build
        run: go build ./...

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./... -v -count=1 -race

      - name: Build API
        run: go build -trimpath -o bin/aiplex-api ./cmd/aiplex-api

      - name: Build CLI
        run: go build -trimpath -o bin/aiplex ./cmd/aiplex-cli

      - name: Local first run (make demo)
        run: make demo

      - name: End-to-end (real binaries, local mocks; API under -race)
        run: make e2e-race

      - name: Examples (against aiplex dev; installs the OpenAI SDKs temporarily)
        run: make examples-test
        env:
          EXAMPLES_INSTALL_SDKS: "1"
          EXAMPLES_REQUIRE_SDKS: "1"

  console:
    name: Console Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  docs-site:
    name: Docs site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - run: npm ci
      - name: Build (broken links and anchors are errors)
        run: npm run build
      - run: npm run check:links
      - run: npm run typecheck

  release-config:
    name: Release config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json

      # The release embeds the Console in the CLI; goreleaser's before hook
      # refuses to build from the placeholder page.
      - name: Build console (embedded in CLI)
        run: cd console && npm ci && npm run build

      - name: Snapshot release (no publish, docker, signing or SBOM)
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish,docker,sign,sbom

      - name: Archives contain both binaries and checksums exist
        run: |
          set -euo pipefail
          test -s dist/checksums.txt
          archive=$(ls dist/aiplex_*_linux_amd64.tar.gz)
          tar -tzf "$archive" | tee /dev/stderr | grep -qx 'aiplex'
          tar -tzf "$archive" | grep -qx 'aiplex-api'
          mkdir "$RUNNER_TEMP/x" && tar -xzf "$archive" -C "$RUNNER_TEMP/x"
          "$RUNNER_TEMP/x/aiplex" version

  firestore:
    name: Firestore emulator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Check exact billing evidence comparison
        run: python3 -m unittest discover -s tools/qualification -p 'test_*.py'
      - uses: google-github-actions/setup-gcloud@v3
        with:
          version: '592.0.0'
          install_components: cloud-firestore-emulator
      - name: Exercise real emulator transactions and recovery
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8787
          CLOUDSDK_CORE_DISABLE_PROMPTS: '1'
        shell: bash
        run: |
          set -euo pipefail
          gcloud emulators firestore start --host-port="$FIRESTORE_EMULATOR_HOST" --project=aiplex-emulator --quiet > "$RUNNER_TEMP/firestore-emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'curl --silent --max-time 2 -X POST "http://$FIRESTORE_EMULATOR_HOST/shutdown" >/dev/null || true; kill "$emulator_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import os, socket, time
          address, port = os.environ['FIRESTORE_EMULATOR_HOST'].split(':')
          deadline = time.monotonic() + 60
          while time.monotonic() < deadline:
              try:
                  with socket.create_connection((address, int(port)), timeout=1):
                      break
              except OSError:
                  time.sleep(0.25)
          else:
              raise SystemExit('Firestore emulator did not become ready within 60 seconds')
          PY
          go test -race ./internal/registry -count=1 -timeout=4m -json -run '^(TestFirestore(Instance|Agent|Template|DeployHistory|UserScopes|LLMRouteConfig|RoleBinding)|TestQuotaEmulator.*)$' | tee "$RUNNER_TEMP/firestore-tests.jsonl"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firestore-qualification
          path: |
            ${{ runner.temp }}/firestore-emulator.log
            ${{ runner.temp }}/firestore-tests.jsonl
          retention-days: 7

  helm:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - run: helm lint deploy/helm/aiplex
      - run: helm lint deploy/helm/aiplex --values deploy/helm/aiplex/values-dev.yaml
      - run: helm lint deploy/helm/aiplex --values deploy/helm/aiplex/values-prod.yaml

  authz:
    name: Rust authorization
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: authz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  contracts:
    name: Public contract schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r schemas/requirements.txt
      - run: python schemas/check.py
