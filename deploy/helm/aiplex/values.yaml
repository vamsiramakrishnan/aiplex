# AIPlex Helm chart values
# Override per environment: values-dev.yaml, values-prod.yaml

global:
  domain: aiplex.example.com
  projectId: my-gcp-project
  trustDomain: my-gcp-project.svc.id.goog
  registry: us-central1-docker.pkg.dev/my-gcp-project/aiplex

# ─── AIPlex API ───
api:
  replicas: 2
  image:
    repository: ""  # defaults to global.registry/aiplex-api
    tag: latest
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # Configure a pinned identity source before deployment. The API deliberately
  # refuses to start without issuer/audience/JWKS (or a provider config file).
  env: {}
  # Mount operator-provisioned files referenced by api.env. Sources are limited
  # to ConfigMap/Secret references; the chart never embeds their contents.
  extraVolumes: []
  extraVolumeMounts: []  # name, mountPath, optional subPath; always read-only
  # GET /metrics (Prometheus text) needs the AIPLEX_METRICS_TOKEN bearer
  # secret; without it the route answers 503. Reference an existing
  # Kubernetes Secret (the chart never holds the value).
  metricsTokenSecret:
    name: ""
    key: token
  # JWT_ISSUER: https://your-issuer.example
  # JWT_AUDIENCE: aiplex-api
  # JWT_JWKS_URL: https://your-issuer.example/.well-known/jwks.json
  # AIPLEX_MODULES: mcplex,a2aplex,llmplex,skillsplex
  # AIPLEX_IDENTITY_PROVIDERS_FILE: /etc/aiplex/identity.json
  # Extra environment variables
  # MY_VAR: my-value

# ─── AIPlex Console ───
console:
  replicas: 2
  image:
    repository: ""  # defaults to global.registry/aiplex-console
    tag: latest
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ─── OPA ext_authz ───
opa:
  enabled: true
  replicas: 2
  image: openpolicyagent/opa:latest-envoy
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ─── OpenTelemetry ───
# enabled: the API exports traces and metrics over OTLP (OTEL_EXPORTER_OTLP_*
# env on the API Deployment) and the chart runs a collector that forwards to
# Cloud Trace and Cloud Monitoring for global.projectId. Disabled, nothing is
# exported (trace ids are still generated for logs and the usage ledger).
otel:
  enabled: true
  # OTLP endpoint for the API. Empty: the in-chart collector
  # (http://otel-collector.aiplex-system:4318).
  endpoint: ""
  protocol: http/protobuf   # or grpc (then use port 4317)
  # Send W3C traceparent/tracestate on upstream model, tool and agent
  # requests (trace ids then leave the deployment). false strips them.
  propagateUpstream: true
  # Run the collector Deployment from this chart. Set false when endpoint
  # names a collector you run yourself.
  collector: true
  replicas: 1
  # Pinned; update deliberately (never :latest).
  image: otel/opentelemetry-collector-contrib:0.164.0
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ─── AlloyDB Auth Proxy ───
alloydbProxy:
  enabled: true
  replicas: 2
  instanceUri: ""  # projects/PROJECT/locations/REGION/clusters/CLUSTER/instances/INSTANCE
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

# ─── Mesh ───
mesh:
  enabled: true
  strictMtls: true

# ─── Ory Hydra (subchart) ───
hydra:
  enabled: true
  hydra:
    config:
      urls:
        self:
          issuer: https://aiplex.example.com/auth/realms/aiplex
        consent: https://aiplex.example.com/auth/consent
        login: https://aiplex.example.com/auth/login
      oauth2:
        token_hook:
          url: http://aiplex-api:8080/auth/token-hook
      strategies:
        access_token: jwt
        scope: exact
      # DSN set via secret
  deployment:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi

# ─── Ory Kratos (subchart) ───
kratos:
  enabled: true
  kratos:
    config:
      identity:
        default_schema_id: user_v1
        schemas:
          - id: user_v1
            url: file:///etc/kratos/identity-schema.json
      selfservice:
        flows:
          login:
            ui_url: https://aiplex.example.com/auth/login
          registration:
            ui_url: https://aiplex.example.com/auth/register
  deployment:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
