{{- $apiVolumeNames := dict -}}
{{- range .Values.api.extraVolumes }}
{{- $name := required "api.extraVolumes entries require a name" .name -}}
{{- if hasKey $apiVolumeNames $name }}{{ fail "duplicate api.extraVolumes name" }}{{ end -}}
{{- if eq $name "tmp" }}{{ fail "api.extraVolumes name tmp is reserved for the API's scratch directory" }}{{ end -}}
{{- $_ := set $apiVolumeNames $name true -}}
{{- if eq (hasKey . "secret") (hasKey . "configMap") }}{{ fail "api.extraVolumes must select exactly one Secret or ConfigMap" }}{{ end -}}
{{- range $key, $value := . }}
{{- if not (has $key (list "name" "secret" "configMap")) }}{{ fail "api.extraVolumes supports Secret/ConfigMap sources only" }}{{ end -}}
{{- end -}}
{{- if hasKey . "secret" }}{{- $_ := required "Secret volume requires secretName" .secret.secretName -}}{{- end -}}
{{- if hasKey . "configMap" }}{{- $_ := required "ConfigMap volume requires name" .configMap.name -}}{{- end -}}
{{- end -}}
{{- range .Values.api.extraVolumeMounts }}
{{- if not (hasKey $apiVolumeNames .name) }}{{ fail "api.extraVolumeMounts references an undeclared volume" }}{{ end -}}
{{- $path := required "api.extraVolumeMounts requires mountPath" .mountPath -}}
{{- if or (not (hasPrefix "/" $path)) (eq $path "/") (ne (clean $path) $path) }}{{ fail "api mountPath must be a canonical absolute non-root path" }}{{ end -}}
{{- if and (hasKey . "readOnly") (ne .readOnly true) }}{{ fail "API configuration mounts must be read-only" }}{{ end -}}
{{- if .subPath }}{{- if or (hasPrefix "/" .subPath) (hasPrefix "../" .subPath) (eq .subPath "..") (ne (clean .subPath) .subPath) }}{{ fail "API configuration subPath must be a canonical relative path" }}{{ end -}}{{- end -}}
{{- range $key, $value := . }}
{{- if not (has $key (list "name" "mountPath" "subPath" "readOnly")) }}{{ fail "unsupported API configuration mount field" }}{{ end -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiplex-api
  namespace: {{ include "aiplex.namespace" . }}
  annotations:
    iam.gke.io/gcp-service-account: aiplex-api@{{ .Values.global.projectId }}.iam.gserviceaccount.com
  labels:
    {{- include "aiplex.labels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiplex-api
  namespace: {{ include "aiplex.namespace" . }}
  labels:
    {{- include "aiplex.labels" . | nindent 4 }}
    app.kubernetes.io/name: aiplex-api
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: aiplex-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiplex-api
    spec:
      serviceAccountName: aiplex-api
      # The API keeps the Kubernetes service account token: the deploy engine
      # (internal/deploy) talks to the Kubernetes API in-cluster, with the
      # namespaced Roles in api-rbac.yaml.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        # distroless/static:nonroot
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: aiplex-api
        image: {{ include "aiplex.api.image" . }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PORT
          value: "8080"
        - name: GCP_PROJECT
          value: {{ .Values.global.projectId | quote }}
        - name: HYDRA_ADMIN_URL
          value: "http://{{ .Release.Name }}-hydra-admin:4445"
        - name: HYDRA_PUBLIC_URL
          value: "http://{{ .Release.Name }}-hydra-public:4444"
        - name: KRATOS_ADMIN_URL
          value: "http://{{ .Release.Name }}-kratos-admin:4434"
        - name: KRATOS_PUBLIC_URL
          value: "http://{{ .Release.Name }}-kratos-public:4433"
        - name: TRUST_DOMAIN
          value: {{ .Values.global.trustDomain | quote }}
        - name: LOG_LEVEL
          value: "info"
        - name: GATEWAY_NAME
          value: "aiplex-gateway"
        {{- if .Values.otel.enabled }}
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: {{ .Values.otel.endpoint | default (printf "http://otel-collector.%s:4318" (include "aiplex.namespace" .)) | quote }}
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: {{ .Values.otel.protocol | default "http/protobuf" | quote }}
        - name: OTEL_SERVICE_NAME
          value: "aiplex-api"
        {{- end }}
        - name: AIPLEX_TRACE_PROPAGATE_UPSTREAM
          value: {{ ternary "true" "false" (ne .Values.otel.propagateUpstream false) | quote }}
        {{- with .Values.api.metricsTokenSecret }}
        {{- if .name }}
        - name: AIPLEX_METRICS_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .name | quote }}
              key: {{ .key | default "token" | quote }}
        {{- end }}
        {{- end }}
        {{- with .Values.denialIngest.tokenSecret }}
        {{- if .name }}
        - name: AIPLEX_DENIAL_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .name | quote }}
              key: {{ .key | default "token" | quote }}
        {{- end }}
        {{- end }}
        {{- with .Values.usage }}
        {{- with .traceUrlTemplate }}
        - name: AIPLEX_TRACE_URL_TEMPLATE
          value: {{ . | quote }}
        {{- end }}
        - name: AIPLEX_FEEDBACK_COMMENTS
          value: {{ ternary "true" "false" (eq .feedbackComments true) | quote }}
        {{- with .tagKeysAllowed }}
        - name: AIPLEX_TAG_KEYS_ALLOWED
          value: {{ join "," . | quote }}
        {{- end }}
        {{- with .tagMaxValues }}
        - name: AIPLEX_TAG_MAX_VALUES
          value: {{ . | quote }}
        {{- end }}
        {{- with .otlp }}
        {{- with .maxRecordsPerRequest }}
        - name: AIPLEX_OTLP_MAX_RECORDS_PER_REQUEST
          value: {{ . | quote }}
        {{- end }}
        {{- with .maxBodyBytes }}
        - name: AIPLEX_OTLP_MAX_BODY_BYTES
          value: {{ . | quote }}
        {{- end }}
        {{- with .requestsPerSecond }}
        - name: AIPLEX_OTLP_REQUESTS_PER_SECOND
          value: {{ . | quote }}
        {{- end }}
        {{- with .recordsPerSecond }}
        - name: AIPLEX_OTLP_RECORDS_PER_SECOND
          value: {{ . | quote }}
        {{- end }}
        - name: AIPLEX_OTLP_FORWARD
          value: {{ ternary "true" "false" (eq .forward true) | quote }}
        {{- end }}
        {{- end }}
        {{- range $key, $value := .Values.api.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        volumeMounts:
        # Writable scratch space; the root filesystem is read-only.
        - name: tmp
          mountPath: /tmp
        {{- with .Values.api.extraVolumeMounts }}
        {{- range . }}
        - name: {{ .name | quote }}
          mountPath: {{ .mountPath | quote }}
          readOnly: true
          {{- with .subPath }}
          subPath: {{ . | quote }}
          {{- end }}
        {{- end }}
        {{- end }}
        resources:
          {{- toYaml .Values.api.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
      volumes:
      - name: tmp
        emptyDir: {}
      {{- with .Values.api.extraVolumes }}
        {{- toYaml . | nindent 6 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: aiplex-api
  namespace: {{ include "aiplex.namespace" . }}
  labels:
    {{- include "aiplex.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: aiplex-api
  ports:
  - name: http
    port: 8080
    targetPort: http
