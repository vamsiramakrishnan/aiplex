apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiplex-console
  namespace: {{ include "aiplex.namespace" . }}
  labels:
    {{- include "aiplex.labels" . | nindent 4 }}
    app.kubernetes.io/name: aiplex-console
    app.kubernetes.io/component: console
spec:
  replicas: {{ .Values.console.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: aiplex-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiplex-console
    spec:
      # The console serves static files and never calls the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # nginxinc/nginx-unprivileged (console/Dockerfile) runs as uid 101.
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: nginx
        image: {{ include "aiplex.console.image" . }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        # nginx-unprivileged keeps its pid and temp files under /tmp.
        - name: tmp
          mountPath: /tmp
        resources:
          {{- toYaml .Values.console.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 30
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aiplex-console
  namespace: {{ include "aiplex.namespace" . }}
  labels:
    {{- include "aiplex.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: aiplex-console
  ports:
  - name: http
    port: 80
    targetPort: http
