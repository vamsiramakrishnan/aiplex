# Raw manifest; the Helm chart renders the same collector with the project
# filled in from global.projectId. Replace PROJECT_ID before applying, e.g.
#   sed "s/PROJECT_ID/$(gcloud config get-value project)/g" deploy/k8s/otel-collector.yaml | kubectl apply -f -
# Applied unchanged it exports to a project named "PROJECT_ID" and fails.
# aiplex-api sends OTLP here (http://otel-collector.aiplex-system:4318, see
# deploy/k8s/aiplex-api.yaml). The collector runs as its own service account,
# mapped to the aiplex-otel-collector Google service account (Terraform,
# otel_collector = true), which holds roles/cloudtrace.agent and
# roles/monitoring.metricWriter.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: aiplex-system
  annotations:
    iam.gke.io/gcp-service-account: aiplex-otel-collector@PROJECT_ID.iam.gserviceaccount.com
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: aiplex-system
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus:
        config:
          scrape_configs:
          - job_name: 'envoy-gateway'
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                names: [aiplex-system]
            relabel_configs:
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
              action: keep
              regex: true

    processors:
      batch:
        timeout: 10s
        send_batch_size: 1024
      memory_limiter:
        check_interval: 5s
        limit_mib: 400
        spike_limit_mib: 100
      resource:
        attributes:
        - key: service.namespace
          value: aiplex
          action: upsert

    exporters:
      googlecloud:
        project: PROJECT_ID
      # Cloud Trace
      googlecloud/trace:
        project: PROJECT_ID

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [googlecloud/trace]
        metrics:
          receivers: [otlp, prometheus]
          processors: [memory_limiter, batch, resource]
          exporters: [googlecloud]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [googlecloud]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: aiplex-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      serviceAccountName: otel-collector
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:0.164.0  # pinned; update deliberately
        args: ["--config=/etc/otel/config.yaml"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 4317
          name: otlp-grpc
        - containerPort: 4318
          name: otlp-http
        - containerPort: 13133
          name: health
        volumeMounts:
        - name: config
          mountPath: /etc/otel
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /
            port: 13133
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 13133
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: aiplex-system
spec:
  selector:
    app: otel-collector
  ports:
  - name: otlp-grpc
    port: 4317
    targetPort: otlp-grpc
  - name: otlp-http
    port: 4318
    targetPort: otlp-http
