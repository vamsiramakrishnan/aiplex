# MCPlex Only — deploy MCP servers and grant tool access
#
# Simplest setup: two tools and one agent allowed to call them.
#
# The template IDs below must exist in your platform's catalog (`aiplex catalog
# list --plane mcplex`). `aiplex dev` has no catalog, so this file is not run by
# `make examples-test`.
#
# Usage: aiplex apply -f examples/mcplex-only.yaml

version: v1

instances:
  - name: GitHub MCP Server
    plane: mcplex
    template: github-mcp-server
    config:
      token_secret: github-token  # Secret Manager reference

  - name: Postgres MCP Server
    plane: mcplex
    template: postgres-mcp-server
    config:
      connection_secret: pg-connection  # Secret Manager reference

agents:
  - client_id: coding-agent
    display_name: Coding Agent
    description: Agent with GitHub and database access
    # `aiplex apply` cannot send redirect URIs, so it can register client-credentials
    # agents only. An authorization-code (PKCE) client for an IDE needs redirect
    # URIs; register it through the API or the Go SDK (`redirect_uris`).
    auth_method: client_credentials
    grant_types:
      - client_credentials
    allowed_scopes:
      - mcp:tools:github_search
      - mcp:tools:github_read_file
      - mcp:tools:github_create_pr
      - mcp:tools:pg_query
      - mcp:tools:pg_schema
