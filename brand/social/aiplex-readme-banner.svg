<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="aiplex-banner-title aiplex-banner-desc">
  <title id="aiplex-banner-title">AIPlex</title>
  <desc id="aiplex-banner-desc">AIPlex README banner: reversed lockup and description on an Ink panel with the six Plex module icons; the panel carries its own background so it reads on light and dark pages.</desc>

  <defs>
    <symbol id="i-mcplex" viewBox="0 0 24 24"><path d="M3 9h5M3 15h5M9 6h8v12H9ZM17 12h5" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-a2aplex" viewBox="0 0 24 24"><path d="M3 3h6v6H3ZM15 15h6v6h-6ZM9 6h9v9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 4h4v4h-4Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-llmplex" viewBox="0 0 24 24"><path d="M6 6h12v12H6ZM9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 10h4v4h-4Z" fill="currentColor" stroke="none"/></symbol>
