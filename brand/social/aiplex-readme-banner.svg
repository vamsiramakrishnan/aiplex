    <symbol id="i-access-point" viewBox="0 0 24 24"><path d="M2 12h7M15 12h7M6 4v16M18 4v16" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 9h6v6H9Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-identity" viewBox="0 0 24 24"><path d="M3 5h18v14H3ZM14 10h4M14 14h4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 9h6v6H6Z" fill="currentColor" stroke="none"/></symbol>
