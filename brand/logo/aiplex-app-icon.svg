<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="aiplex-app-icon-title aiplex-app-icon-desc">
  <title id="aiplex-app-icon-title">AIPlex</title>
  <desc id="aiplex-app-icon-desc">AIPlex app icon: the gate mark in light lanes and Gate Blue on an Ink rounded square. The mark sits 8 px left of geometric centre to balance the weight of the gate.</desc>
  <rect id="container" width="512" height="512" rx="112" fill="#141A2E"/>
  <g id="mark" transform="translate(88 96) scale(10)">
    <path id="lanes" d="M2 6h4l10 10M2 26h4l10-10M2 16h14M24 16h6" fill="none" stroke="#E8EBF2" stroke-width="4"/>
    <rect id="gate" x="14" y="10" width="12" height="12" fill="#8DA2FF"/>
  </g>
</svg>
